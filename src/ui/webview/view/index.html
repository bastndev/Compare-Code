<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{CSS_URI}}">
    <script src="{{SCRIPT_URI}}" defer></script>
</head>
<body>
    <!-- ======================================
         TOOLBAR - Top navigation and controls
         ====================================== -->
    <div class="toolbar">
        <!-- Warning container -->
         
        <!-- <div class="warning-container">
            <div class="warning-box">
                <img class="warning-icon" src="{{WARNING_ICON}}">
                <span>1 : Changes</span>
            </div>
        </div>  -->

        <!-- TODO: Diff statistics display -->
        <div class="diff-stats">
            <div class="stat-item">
                <div class="stat-icon added">+</div>
                <span id="added-count">0 lines added</span>
            </div>
            <div class="stat-item">
                <div class="stat-icon removed">-</div>
                <span id="removed-count">0 lines removed</span>
            </div>
            <div class="stat-item">
                <div class="stat-icon modified">~</div>
                <span id="modified-count">0 lines modified</span>
            </div>
        </div>

        <!-- TODO: Primary compare button | PLAY -->
        <button class="btn-play" onclick="toggle()" id="playBtn" title="Ctrl + Enter">
            <img src="{{PLAY_ICON}}">
            <span>Compare</span>
        </button>

        <!-- TODO: Secondary panel controls | Clear - Close & Open -->
        <div class="buttons-container">
            <button class="clear" onclick="clearAll()">🗑️ Clear</button>
            
            <button class="btn-panel-left" id="btn-panel-left" data-tooltip="Close/Open panel LEFT">
                <img src="{{PANEL_LEFT_ICON}}">
            </button>
            <span class="slash">/</span>
            <button class="btn-panel-right" id="btn-panel-right" data-tooltip="Close/Open panel RIGHT">
                <img src="{{PANEL_RIGHT_ICON}}">
            </button>
        </div>
    </div>

    <!-- FILE IMPORT | DOWNLOAD - COPY - CLEAR -->
    <div class="compare-panel">1 Box & 2 Box</div>

    <!-- ======================================
         Main comparison interface | HYBRID ARCHITECTURE
         ====================================== -->

    <div class="compare-code">
        <div class="code-panel" id="panel1">
            <!-- Unified Editor Container -->
            <div class="unified-editor" id="editor1">
                <div class="line-numbers" id="lineNumbers1">1</div>
                <div class="code-area">
                    <!-- Edit Mode: Textarea -->
                    <textarea 
                        class="code-input" 
                        id="codeInput1" 
                        placeholder="Example One Code here..."
                        spellcheck="false"></textarea>
                    <!-- Compare Mode: Rendered Diff -->
                    <div class="code-display" id="codeDisplay1"></div>
                </div>
            </div>
        </div>
        
        <div class="code-panel" id="panel2">
            <!-- Unified Editor Container -->
            <div class="unified-editor" id="editor2">
                <div class="line-numbers" id="lineNumbers2">1</div>
                <div class="code-area">
                    <!-- Edit Mode: Textarea -->
                    <textarea 
                        class="code-input" 
                        id="codeInput2" 
                        placeholder="Example Two Code here..."
                        spellcheck="false"></textarea>
                    <!-- Compare Mode: Rendered Diff -->
                    <div class="code-display" id="codeDisplay2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================
         BOTTOM BAR - Floating tool controls
         ====================================== -->
    <div class="bottom-bar">
        <div class="content">
            <button class="only-code bbtn" data-tooltip="Show modified code">
                <img class="icon" src="{{ONLY_CODE_ICON}}">
            </button>
            <button class="dual-scroll bbtn" data-tooltip="Dual scroll">
                <img class="icon" src="{{DUAL_SCROLL_ICON}}">
            </button>
            <button class="switch-on-off bbtn" data-tooltip="Normal/Pro version">
                <img class="icon" src="{{SWITCH_ON_ICON}}">
            </button>
            <button class="language bbtn" data-tooltip="Change language">
                <img class="icon" src="{{LANGUAGE_ICON}}">
            </button>
            <button class="sponsor bbtn" data-tooltip="Sponsor">
                <a href="https://github.com/sponsors/bastndev" title="@bastndev">
                    <img class="icon" src="{{EARTH_CODE_ICON}}">
                </a>
            </button>
        </div>
    </div>
</body>
</html>
