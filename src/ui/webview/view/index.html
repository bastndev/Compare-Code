<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{CSS_URI}}">
    <script src="{{SCRIPT_URI}}" defer></script>
</head>
<body>
    <!-- Top toolbar with | Info -->
    <div class="toolbar">
        <div class="warning">
            <img class="warning-icon" src="{{WARNING_ICON}}">
            <span>1 : Changes</span>
        </div>

        <button class="btn">
            <img src="{{PLAY_ICON}}">
        </button>

        <div class="buttons">
            <button class="clear">🗑️ Clear</button>
            
            <button class="btn-panel-left" ><img src="{{PANEL_LEFT_ICON}}"></button>
            <h1>/</h1>
            <button class="btn-panel-right"><img src="{{PANEL_RIGHT_ICON}}"></button>
        </div>
    </div>

    <!-- Main container with panels -->
    <div class="diff-panel">
        <!-- Left editor panel -->
        <div class="editor-panel-left">
            <div class="panel-container">
                <span class="select-tec">Select Technology 1</span>
            </div>
            <div class="panel-header">Editor - Left Panel</div>
            <div class="editor-content">
                <div class="code-line code-removed">    // This line was removed</div>
                <div class="code-line code-modified">    return true; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>        

        <div class="separator"></div> <!--  Separator Line-->

        <!-- Right editor panel -->
        <div class="editor-panel-right">
            <div class="panel-container">
                <span class="select-tec">Select Technology 2</span>
            </div>
            <div class="panel-header">Editor - Right Panel</div>
            <div class="editor-content">
                <div class="code-line code-added">    // This line was added</div>
                <div class="code-line code-modified">    return false; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>
    </div>

    <!-- Bottom bar | Tools -->
    <div class="bottom-bar">
        <div class="content">
            <button>你好</button>
            <button>Hello</button>
            <button>Hola</button>
            <button>Xin chào</button>
        </div>
    </div>
</body>
</html>
