<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{CSS_URI}}">
    <script src="{{SCRIPT_URI}}" defer></script>
</head>
<body>
    <!-- Top toolbar with | Info -->
    <div class="toolbar">
        <!-- <div class="warning-container">
            <div class="warning-box">
                <img class="warning-icon" src="{{WARNING_ICON}}">
                <span>1 : Changes</span>
            </div>
        </div> -->

        <div class="diff-stats">
                <div class="stat-item">
                    <div class="stat-icon added">+</div>
                    <span>4 lines added</span>
                </div>
                <div class="stat-item">
                    <div class="stat-icon removed">-</div>
                    <span>2 lines removed</span>
                </div>
                <div class="stat-item">
                    <div class="stat-icon modified">~</div>
                    <span>3 lines modified</span>
                </div>
        </div>

        <button class="btn-play">
            <img src="{{PLAY_ICON}}">
            <span>Compare</span>
        </button>

        <div class="buttons-container">
            <button class="clear">🗑️ Clear</button>
            
            <button class="btn-panel-left" ><img src="{{PANEL_LEFT_ICON}}"></button>
            <h1>/</h1>
            <button class="btn-panel-right"><img src="{{PANEL_RIGHT_ICON}}"></button>
        </div>
    </div>

    <!-- Main container with panels -->
    <div class="diff-panel">
        <!-- Left editor panel -->
        <div class="editor-panel-left">
            <div class="file-info">
                <div class="file-icon">JS</div>
                <select class="select">
                    <option>modified.js</option>
                    <option>Astro.js</option>
                    <option>_diff-panel.scss</option>
                </select>
                <div class="clear-copy">
                    <img src="{{COPY_ICON}}">
                    <img src="{{CLEAR_ICON}}">
                </div>
            </div>
            <div class="editor-content">
                <div class="code-line code-removed">    // This line was removed</div>
                <div class="code-line code-modified">    return true; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>        

        <div class="separator"><div class="on1"></div><div class="on2"></div></div> <!--  Separator 2 box vertical -->

        <!-- Right editor panel -->
        <div class="editor-panel-right">
            <div class="file-info">
                <div class="file-icon">JS</div>
                <select class="select">
                    <option>Astro.js</option>
                    <option>modified.js</option>
                    <option>_diff-panel.scss</option>
                </select>
                <div class="clear-copy">
                    <img src="{{COPY_ICON}}">
                    <img src="{{CLEAR_ICON}}">
                </div>
            </div>
            <div class="editor-content">
                <div class="code-line code-added">    // This line was added</div>
                <div class="code-line code-modified">    return false; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>
    </div>

    <!-- Bottom bar | Tools -->
    <div class="bottom-bar">
        <div class="content">
            <button><img class="icon" src="{{ONLY_CODE_ICON}}""></button>
            <button><img class="icon" src="{{DUAL_SCROLL_ICON}}""></button>
            <button><img class="icon" src="{{SWITCH_ON_ICON}}""></button>
            <button><img class="icon" src="{{LANGUAGE_ICON}}""></button>
            <button><img class="icon" src="{{EARTH_CODE_ICON}}""></button>
        </div>
    </div>
</body>
</html>
