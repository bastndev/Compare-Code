<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{CSS_URI}}">
</head>
<body>
    <div class="container">
        <div class="circle" id="circle"></div>
        <div class="message" id="message">Click! 🎉</div>
    </div>

    <script>
        const circle = document.getElementById('circle');
        const message = document.getElementById('message');
        let clickCount = 0;
        const colors = ['rgb(9, 255, 0)', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24'];
        
        const showMessage = (text) => {
            message.textContent = text;
            message.classList.add('show');
            setTimeout(() => message.classList.remove('show'), 1000);
        };
        
        circle.addEventListener('click', () => {
            clickCount++;
            circle.classList.add('clicked');
            circle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            showMessage(`¡Click #${clickCount}! 🎉`);
            setTimeout(() => circle.classList.remove('clicked'), 1000);
        });
        
        circle.addEventListener('dblclick', () => {
            clickCount = 0;
            circle.style.backgroundColor = colors[0];
            showMessage('Reset! 🔄');
        });
    </script>
</body>
</html>
