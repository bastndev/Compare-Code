<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{CSS_URI}}">
    <script src="{{SCRIPT_URI}}" defer></script>
</head>
<body>
    <!-- Top toolbar with | Info -->
    <div class="toolbar">
        <div class="warning"></div>
        <button class="btn"></button>
        <div class="buttons"></div>
    </div>
    
    <!-- Main container with panels -->
    <div class="container">
        <!-- Left editor panel -->
        <div class="editor-panel-left">
            <div class="panel-header">Editor - Left Panel</div>
            <div class="editor-content">
                <div class="code-line code-removed">    // This line was removed</div>
                <div class="code-line code-modified">    return true; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>
        
        <!-- Right editor panel -->
        <div class="editor-panel-right">
            <div class="panel-header">Editor - Right Panel</div>
            <div class="editor-content">
                <div class="code-line code-added">    // This line was added</div>
                <div class="code-line code-modified">    return false; // Modified</div>
                <div class="code-line">}</div>
            </div>
        </div>
    </div>
    
    <!-- Bottom bar | Tools -->
    <div class="bottom-bar">
        <button>Hola</button>
    </div>
</body>
</html>
